# Perfil medido en la Radeon RX 6700S. No modifica configs/local.yaml.
paths:
  tfrecords: data/raw/tpu-getting-started/tfrecords-jpeg-224x224
  processed: data/processed
  models: models/directml_fast
  runs: reports/runs/directml_fast
  figures: reports/figures/directml_fast
  results: reports/resultados_directml_fast.csv

data:
  img_size: 112
  num_classes: 104
  batch_size: 64
  cache: ram          # ~2.5 GB para train+val; usar disk si se abren otras apps pesadas

runtime:
  backend: directml
  input_pipeline: dlpack_prefetch

distill:
  ipc: 10
  iterations: 500
  real_batch: 64
  classes_per_step: 8
  lr_img: 0.01
  log_every: 25

train:
  lr: 0.001
  epochs_full: 150
  epochs_small: 300
  eval_every_small: 10
  patience: 5

wandb:
  enabled: false      # agregar --wandb para sincronizar gráficas
  project: flower-cnn
  entity: null
  mode: online

experiments:
  data: [random, distilled]
  ipcs: [1, 10]
  seeds: [0, 1, 2]
  include_full: false

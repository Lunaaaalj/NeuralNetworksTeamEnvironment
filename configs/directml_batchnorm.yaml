# Experimento sin ejecutar: CNN de 4 convoluciones con BatchNorm antes de cada ReLU.
paths:
  tfrecords: data/raw/tpu-getting-started/tfrecords-jpeg-224x224
  processed: data/processed
  models: models/directml_batchnorm
  runs: reports/runs/directml_batchnorm
  figures: reports/figures/directml_batchnorm
  results: reports/resultados_directml_batchnorm.csv

model:
  architecture: batchnorm

data:
  img_size: 112
  num_classes: 104
  batch_size: 64
  cache: ram

runtime:
  backend: directml
  input_pipeline: dlpack_prefetch

train:
  optimizer: adam
  lr: 0.001
  epochs_full: 150
  epochs_small: 300
  eval_every_small: 10
  patience: 5

wandb:
  enabled: false
  project: flower-cnn
  entity: null
  mode: online

experiments:
  data: []
  ipcs: []
  seeds: [0]
  include_full: true

# Reporte final: referencia = "CNN original + AdamW + LR adaptable", el modelo elegido en el
# Avance 4, ahora con TensorFlow (Mac M-series vía tensorflow-metal, o cualquier GPU/CPU).
# scripts/run_final.py deriva de aquí un config por experimento con una sola diferencia.
paths:
  tfrecords: data/raw/tpu-getting-started/tfrecords-jpeg-224x224
  processed: data/processed
  models: models/final
  runs: reports/final/experimentos/runs
  figures: models/final/figures   # matrices de 104x104 pesadas: fuera de Git
  results: reports/final/resultados.csv

model:
  architecture: baseline
  dropout: 0.5
  l2: 0.0

data:
  img_size: 112
  num_classes: 104
  batch_size: 64
  cache: ram
  augment: true

train:
  optimizer: adamw
  weight_decay: 0.01
  lr: 0.001
  lr_schedule:
    type: plateau
    factor: 0.5
    patience: 2
    min_lr: 1.0e-05
  label_smoothing: 0.0
  class_weight: none
  train_eval_images: 3712   # subconjunto fijo de train, mismo tamaño que val
  epochs_full: 150
  epochs_small: 300
  eval_every_small: 10
  patience: 12

wandb:
  enabled: false
  project: flower-cnn
  entity: null
  mode: online

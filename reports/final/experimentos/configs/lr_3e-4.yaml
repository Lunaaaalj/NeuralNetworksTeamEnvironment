paths:
  tfrecords: data/raw/tpu-getting-started/tfrecords-jpeg-224x224
  processed: data/processed
  models: models/final/lr_3e-4
  runs: reports/final/experimentos/runs/lr_3e-4
  figures: models/final/figures/lr_3e-4
  results: reports/final/resultados.csv
model:
  architecture: baseline
  dropout: 0.5
  l2: 0.0
data:
  img_size: 112
  num_classes: 104
  batch_size: 64
  cache: ram
  augment: true
train:
  optimizer: adamw
  weight_decay: 0.01
  lr: 0.0003
  lr_schedule:
    type: plateau
    factor: 0.5
    patience: 2
    min_lr: 1.0e-05
  label_smoothing: 0.0
  class_weight: none
  train_eval_images: 3712
  epochs_full: 150
  epochs_small: 300
  eval_every_small: 10
  patience: 12
wandb:
  enabled: false
  project: flower-cnn
  entity: null
  mode: online
experiment:
  label: lr_3e-4
  group: hiperparametros
  description: Tasa de aprendizaje 3e-4 (en vez de 1e-3)

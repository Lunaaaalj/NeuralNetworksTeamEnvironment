paths:
  tfrecords: data/raw/tpu-getting-started/tfrecords-jpeg-224x224
  processed: data/processed
  models: models/final/mlp
  runs: reports/final/experimentos/runs/mlp
  figures: models/final/figures/mlp
  results: reports/final/resultados.csv
model:
  architecture: mlp
  dropout: 0.5
  l2: 0.0
data:
  img_size: 112
  num_classes: 104
  batch_size: 64
  cache: ram
  augment: true
train:
  optimizer: adamw
  weight_decay: 0.01
  lr: 0.0001
  lr_schedule:
    type: plateau
    factor: 0.5
    patience: 2
    min_lr: 1.0e-06
  label_smoothing: 0.0
  class_weight: none
  train_eval_images: 3712
  epochs_full: 150
  epochs_small: 300
  eval_every_small: 10
  patience: 12
wandb:
  enabled: false
  project: flower-cnn
  entity: null
  mode: online
experiment:
  label: mlp
  group: arquitectura
  description: 'MLP: 112x112x3 aplanada -> 256 -> 104 (LR 1e-4)'
